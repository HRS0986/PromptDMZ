[project]
name = "promptdmz"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bitsandbytes>=0.46.1",
    "datasets>=5.0.0",
    "fastapi>=0.138.1",
    "huggingface-hub==0.33.4",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.0.0",
    "matplotlib>=3.11.0",
    "pandas>=3.0.3",
    "pandas-stubs~=3.0.3",
    "peft==0.16.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
    "scipy-stubs~=1.18.0",
    "torch>=2.2.1",
    "transformers==4.53.1",
    "triton-windows>=3.2.0,<3.3 ; sys_platform == 'win32'",
    "trl==0.19.1",
    "unsloth>=2025.7.2",
    "uvicorn>=0.49.0",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.uv.extra-build-dependencies]
xformers = ["torch"]
