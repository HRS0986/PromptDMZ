[project]
name = "promptdmz"
version = "0.1.0"
description = "Category-specialised QLoRA adapters on a shared quantized SLM backbone with calibrated learned fusion and conformal FPR control."
readme = "README.md"
requires-python = ">=3.12"

# Behaviour-critical libraries are pinned EXACTLY to the versions the adapters were
# trained under (read from the Unsloth banners saved in the reference notebooks' outputs).
# `torch` is left loose on purpose so Kaggle/Colab's pre-provisioned CUDA build satisfies it.
# See docs/ENVIRONMENT.md for the provenance of every pin.
dependencies = [
    # --- behaviour-critical: exact pins ---
    "accelerate==1.14.0",
    "bitsandbytes==0.50.0",
    "peft==0.16.0",
    "transformers==4.53.1",
    "trl==0.19.1",
    "unsloth==2025.7.2",
    # --- loose on purpose: platform GPU builds must satisfy this ---
    "torch>=2.2.1",
    "triton-windows>=3.2.0,<3.3 ; sys_platform == 'win32'",
    # --- data / decision layer (CPU) ---
    "datasets>=5.0.0",
    "huggingface-hub==0.33.4",
    "matplotlib>=3.11.0",
    "pandas>=3.0.3",
    "pyarrow>=25.0.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
    # --- notebook / tooling ---
    "ipykernel>=7.3.0",
    "ipywidgets>=8.0.0",
    "pandas-stubs~=3.0.3",
    "scipy-stubs~=1.18.0",
]

# Phase 9 only. Kept out of the default install so the GPU/CPU analysis environment
# stays minimal: `uv sync --extra serve` when you want the demo server.
[project.optional-dependencies]
serve = [
    "fastapi>=0.138.1",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.uv.extra-build-dependencies]
xformers = ["torch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
